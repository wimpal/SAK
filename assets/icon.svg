<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE382C"/>
      <stop offset="1" stop-color="#AE130A"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <rect x="32" y="32" width="960" height="960" rx="208" fill="url(#red)"/>

  <!-- steel inner ring: the blade-metal hint -->
  <rect x="68" y="68" width="888" height="888" rx="172" fill="none" stroke="url(#steel)" stroke-width="10" opacity="0.5"/>

  <!-- soft shadow under the cross -->
  <g opacity="0.18">
    <rect x="412" y="248" width="200" height="560" rx="36" fill="#000000"/>
    <rect x="232" y="428" width="560" height="200" rx="36" fill="#000000"/>
  </g>

  <!-- Swiss cross -->
  <rect x="412" y="232" width="200" height="560" rx="36" fill="#FFFFFF"/>
  <rect x="232" y="412" width="560" height="200" rx="36" fill="#FFFFFF"/>
</svg>
